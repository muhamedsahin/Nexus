name: Benchmark evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'python/src/nexus_bench/**'
      - 'benchmarks/runner/bench_phase21.cpp'
      - 'tests/parity/test_phase21_bench.py'
      - 'lib/**'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Checkout's submodule-auth cleanup recursively visits stale build-tree gitlinks.
          submodules: false
          persist-credentials: false
      - name: Initialize pinned source libraries without build-tree recursion
        run: >-
          git -c submodule.recurse=false submodule update --init --
          lib/MatrixFlash-Pro lib/NexusOptim lib/NexusModel lib/NexusLoss lib/NexusData
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tests/parity/test_phase21_bench.py
      - name: Build portable CPU measurement
        run: >-
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DNEXUS_ENABLE_CUDA=OFF
          -DNEXUS_ENABLE_AVX512=OFF -DNEXUS_ENABLE_VULKAN=OFF -DNEXUS_ENABLE_DIRECTML=OFF
          -DNEXUS_BUILD_PYTHON=OFF
      - run: cmake --build build-ci --target bench_phase21 --parallel 2
      - name: Measure CPU without substituting GPU results
        env:
          OMP_NUM_THREADS: '8'
          NEXUS_CPU_THREADS: '2'
        run: ./build-ci/benchmarks/runner/bench_phase21 > cpu-samples.jsonl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cpu-benchmark-${{ github.sha }}
          path: cpu-samples.jsonl
          if-no-files-found: error
